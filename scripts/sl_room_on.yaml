sl_room_on:
  alias: "SL: Room On"
  description: >
    WO-0322. The room gets its current window scene (window slot or own window
    scene), as the dimmer On button does, with the extension mode gating. The
    Z2M extension does it with the same code as a dimmer button
    (zigbee2mqtt/sl/scene/room, action "Room On"). Every HA light on and off
    goes through this command; do not add a light.turn_on path here.
  mode: parallel
  fields:
    room:
      description: "Room key (living_room, bedroom, bathroom, kitchen, hallway)"
      required: true
      selector:
        text:
  sequence:
    - action: mqtt.publish
      data:
        topic: zigbee2mqtt/sl/scene/room
        payload: "{{ {'room': room | replace('_', ' ') | title, 'action': 'Room On'} | tojson }}"
