sl_toggle_all:
  alias: "SL: Toggle All Lights"
  description: >
    WO-0322. Any room on: all rooms off. Else each room gets its window scene.
    The Z2M extension does it with the same code as a dimmer button
    (zigbee2mqtt/sl/scene/room, action "Toggle All Rooms"). Every HA light on
    and off goes through this command; do not add a light.turn_on path here.
  mode: single
  sequence:
    - action: mqtt.publish
      data:
        topic: zigbee2mqtt/sl/scene/room
        payload: "{{ {'action': 'Toggle All Rooms'} | tojson }}"
