sl_cycle_scene:
  alias: "SL: Cycle Scene"
  description: >
    WO-0322. Next scene in the Button 4 cycle of the room. The Z2M extension
    does it with the same code as a dimmer button (zigbee2mqtt/sl/scene/room,
    action "Cycle Scenes"). Every HA light on and off goes through this
    command; do not add a light.turn_on path here.
  mode: single
  fields:
    room:
      description: "Room key (living_room, bedroom, bathroom, kitchen, hallway)"
      required: true
      selector:
        text:
  sequence:
    - action: mqtt.publish
      data:
        topic: zigbee2mqtt/sl/scene/room
        payload: "{{ {'room': room | replace('_', ' ') | title, 'action': 'Cycle Scenes'} | tojson }}"
