sl_room_off:
  alias: "SL: Room Off"
  description: >
    WO-0322. The room turns off. The Z2M extension does it with the same code
    as a dimmer button (zigbee2mqtt/sl/scene/room, action "Power Off Room").
    Every HA light on and off goes through this command; do not add a
    light.turn_on path here.
  mode: parallel
  fields:
    room:
      description: "Room key (living_room, bedroom, bathroom, kitchen, hallway)"
      required: true
      selector:
        text:
  sequence:
    - action: mqtt.publish
      data:
        topic: zigbee2mqtt/sl/scene/room
        payload: "{{ {'room': room | replace('_', ' ') | title, 'action': 'Power Off Room'} | tojson }}"
