sl_all_rooms_scene:
  alias: "SL: Set All Rooms to Scene"
  description: >
    WO-0300. Each room gets the window scene of the given window (window slot
    or own window scene), on the same path as "Back to window scene". The Z2M
    extension does it (zigbee2mqtt/sl/scene/window with a window).
  mode: single
  fields:
    window:
      description: "Time window: morning, day, evening, night"
      required: true
      selector:
        text:
  sequence:
    - action: mqtt.publish
      data:
        topic: zigbee2mqtt/sl/scene/window
        payload: "{{ {'room': 'All Rooms', 'window': window} | tojson }}"
