# Smart Lighting effects (WO-0269). One effect dropdown for each bulb.
# State: the effect that light.<bulb> reports (a hidden or no effect: none).
# Select: one message {color, effect, effect_speed}, color first, from the
# helpers (helpers/input_number|input_text/sl_effects.yaml): Z2M sets the color,
# then starts the effect with it. Each effect start sets full brightness, so
# the brightness that the bulb had goes after the bulb reports the effect (Z2M
# runs two messages to one bulb at the same time). Live tests WO-0303.
# Not the Z2M select entities:
# Z2M creates them disabled. Do not use YAML merge keys (<<:).
template:
  - select:
      - name: "SL: Living Room Effect"
        unique_id: sl_fx_living_room_1_select
        default_entity_id: select.sl_fx_living_room_1
        icon: mdi:auto-fix
        state: &sl_fx_state >-
          {% set fx = state_attr('light.' ~ this.entity_id.split('.')[1][6:], 'effect') %}
          {% set hidden = ['none', 'blink', 'okay', 'channel_change', 'finish_effect', 'stop_effect', 'stop_hue_effect'] %}
          {{ fx if fx is string and fx not in hidden else 'none' }}
        options: &sl_fx_options >-
          {% set b = this.entity_id.split('.')[1][6:] %}
          {% set white = ['kitchen_1', 'kitchen_2', 'hallway_1'] %}
          {{ ['none'] + (['candle', 'sunset', 'sunrise', 'sparkle', 'opal', 'glisten', 'underwater', 'cosmos', 'sunbeam', 'enchant', 'breathe'] if b in white else ['candle', 'fireplace', 'colorloop', 'sunset', 'sunrise', 'sparkle', 'opal', 'glisten', 'underwater', 'cosmos', 'sunbeam', 'enchant', 'breathe']) }}
        select_option: &sl_fx_select
          - variables:
              bulb: "{{ this.entity_id.split('.')[1][6:] }}"
              topic: "zigbee2mqtt/{{ this.entity_id.split('.')[1][6:] }}/set"
              color: "{{ states('input_text.sl_fx_color_' ~ this.entity_id.split('.')[1][6:]) }}"
              speed: "{{ states('input_number.sl_fx_speed_' ~ this.entity_id.split('.')[1][6:]) }}"
              bri: "{{ state_attr('light.' ~ this.entity_id.split('.')[1][6:], 'brightness') }}"
          - if:
              - condition: template
                value_template: "{{ option == 'none' }}"
            then:
              - action: mqtt.publish
                data:
                  topic: "{{ topic }}"
                  payload: '{"effect": "none"}'
            else:
              - action: mqtt.publish
                data:
                  topic: "{{ topic }}"
                  payload: >-
                    {% set m = {'color': {'hex': color}} if color is match('^#[0-9A-Fa-f]{6}$') else {} %}
                    {% set m = dict(m, effect=option) %}
                    {% if speed not in ['unknown', 'unavailable'] %}{% set m = dict(m, effect_speed=speed | float(0.5)) %}{% endif %}
                    {{ m | to_json }}
              - if:
                  - condition: template
                    value_template: "{{ bri is number }}"
                then:
                  - wait_for_trigger:
                      - trigger: template
                        value_template: "{{ state_attr('light.' ~ bulb, 'effect') == option }}"
                    timeout: {seconds: 3}
                    continue_on_timeout: true
                  - action: mqtt.publish
                    data:
                      topic: "{{ topic }}"
                      payload: "{{ {'brightness': bri | int} | tojson }}"
      - name: "SL: Bedroom 1 Effect"
        unique_id: sl_fx_bedroom_1_select
        default_entity_id: select.sl_fx_bedroom_1
        icon: mdi:auto-fix
        state: *sl_fx_state
        options: *sl_fx_options
        select_option: *sl_fx_select
      - name: "SL: Bedroom 2 Effect"
        unique_id: sl_fx_bedroom_2_select
        default_entity_id: select.sl_fx_bedroom_2
        icon: mdi:auto-fix
        state: *sl_fx_state
        options: *sl_fx_options
        select_option: *sl_fx_select
      - name: "SL: Bedroom Lamp Effect"
        unique_id: sl_fx_lamp_1_select
        default_entity_id: select.sl_fx_lamp_1
        icon: mdi:auto-fix
        state: *sl_fx_state
        options: *sl_fx_options
        select_option: *sl_fx_select
      - name: "SL: Bathroom Effect"
        unique_id: sl_fx_bathroom_1_select
        default_entity_id: select.sl_fx_bathroom_1
        icon: mdi:auto-fix
        state: *sl_fx_state
        options: *sl_fx_options
        select_option: *sl_fx_select
      - name: "SL: Kitchen 1 Effect"
        unique_id: sl_fx_kitchen_1_select
        default_entity_id: select.sl_fx_kitchen_1
        icon: mdi:auto-fix
        state: *sl_fx_state
        options: *sl_fx_options
        select_option: *sl_fx_select
      - name: "SL: Kitchen 2 Effect"
        unique_id: sl_fx_kitchen_2_select
        default_entity_id: select.sl_fx_kitchen_2
        icon: mdi:auto-fix
        state: *sl_fx_state
        options: *sl_fx_options
        select_option: *sl_fx_select
      - name: "SL: Hallway Effect"
        unique_id: sl_fx_hallway_1_select
        default_entity_id: select.sl_fx_hallway_1
        icon: mdi:auto-fix
        state: *sl_fx_state
        options: *sl_fx_options
        select_option: *sl_fx_select
  # Effect color wheel (WO-0273): one light for each color bulb. It is not a
  # bulb: it shows and sets input_text.sl_fx_color_<bulb>. A change goes to the
  # bulb as effect_color (automations/sl_effect_speed_color.yaml), so a running
  # effect keeps running. A normal color change on the bulb stops the effect.
  - light:
      - name: "SL: Living Room Effect Color"
        unique_id: sl_fx_color_living_room_1_light
        default_entity_id: light.sl_fx_color_living_room_1
        icon: mdi:palette
        state: &sl_fx_wheel_state "{{ true }}"
        rgb: &sl_fx_wheel_rgb >-
          {%- set h = states('input_text.sl_fx_color_' ~ this.entity_id.split('.')[1][12:]) -%}
          {%- if h is match('^#[0-9A-Fa-f]{6}$') -%}
          ({{ h[1:3] | int(base=16) }}, {{ h[3:5] | int(base=16) }}, {{ h[5:7] | int(base=16) }})
          {%- else -%}(255, 122, 26){%- endif -%}
        turn_on: &sl_fx_wheel_noop
          - delay: 0
        turn_off: *sl_fx_wheel_noop
        set_rgb: &sl_fx_wheel_set
          - action: input_text.set_value
            target:
              entity_id: "input_text.sl_fx_color_{{ this.entity_id.split('.')[1][12:] }}"
            data:
              value: "{{ '#%02X%02X%02X' | format(r, g, b) }}"
      - name: "SL: Bedroom 1 Effect Color"
        unique_id: sl_fx_color_bedroom_1_light
        default_entity_id: light.sl_fx_color_bedroom_1
        icon: mdi:palette
        state: *sl_fx_wheel_state
        rgb: *sl_fx_wheel_rgb
        turn_on: *sl_fx_wheel_noop
        turn_off: *sl_fx_wheel_noop
        set_rgb: *sl_fx_wheel_set
      - name: "SL: Bedroom 2 Effect Color"
        unique_id: sl_fx_color_bedroom_2_light
        default_entity_id: light.sl_fx_color_bedroom_2
        icon: mdi:palette
        state: *sl_fx_wheel_state
        rgb: *sl_fx_wheel_rgb
        turn_on: *sl_fx_wheel_noop
        turn_off: *sl_fx_wheel_noop
        set_rgb: *sl_fx_wheel_set
      - name: "SL: Bedroom Lamp Effect Color"
        unique_id: sl_fx_color_lamp_1_light
        default_entity_id: light.sl_fx_color_lamp_1
        icon: mdi:palette
        state: *sl_fx_wheel_state
        rgb: *sl_fx_wheel_rgb
        turn_on: *sl_fx_wheel_noop
        turn_off: *sl_fx_wheel_noop
        set_rgb: *sl_fx_wheel_set
      - name: "SL: Bathroom Effect Color"
        unique_id: sl_fx_color_bathroom_1_light
        default_entity_id: light.sl_fx_color_bathroom_1
        icon: mdi:palette
        state: *sl_fx_wheel_state
        rgb: *sl_fx_wheel_rgb
        turn_on: *sl_fx_wheel_noop
        turn_off: *sl_fx_wheel_noop
        set_rgb: *sl_fx_wheel_set
