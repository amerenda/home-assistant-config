# Smart Lighting named scenes (WO-0263). The Z2M extension owns the scenes:
# sensor.sl_scenes (packages/core.yaml) shows zigbee2mqtt/sl/scenes, and the
# scripts in scripts/sl_scenes.yaml send commands to zigbee2mqtt/sl/scene/<op>.
template:
  - select:
      # Button actions. Each select stores its value in input_text.<same id>
      # (helpers/input_text/sl_switch_buttons.yaml). Options: the fixed actions,
      # "Scene: <name>" for each scene, and the stored value if it is not in the list.
      # The other 47 use the same state, options and select_option through value
      # anchors. Do not use YAML merge keys (<<:): HA logs a duplicate key warning
      # for each override at each load (ci/check.sh fails on it).
      - name: "SL: LR Button 1 Short"
        unique_id: sl_living_room_b1_short_select
        default_entity_id: select.sl_living_room_b1_short
        icon: mdi:gesture-tap-button
        state: &sl_btn_state >-
          {% set v = states('input_text.' ~ this.entity_id.split('.')[1]) %}
          {{ v if v not in ['', 'unknown', 'unavailable'] else 'Default' }}
        options: &sl_btn_options >-
          {% set ns = namespace(o=['Default', 'Toggle Room', 'Power Off Room', 'Power Off All', 'Brightness Up', 'Brightness Down', 'Brightness Max', 'Brightness Min', 'Cycle Scenes', 'Toggle All Rooms', 'Multi-Room Scene', 'Do Nothing']) %}
          {% for s in state_attr('sensor.sl_scenes', 'scenes') or [] %}
          {% set ns.o = ns.o + ['Scene: ' ~ s.name] %}
          {% endfor %}
          {% set v = states('input_text.' ~ this.entity_id.split('.')[1]) %}
          {% if v not in ['', 'unknown', 'unavailable'] and v not in ns.o %}
          {% set ns.o = ns.o + [v] %}
          {% endif %}
          {{ ns.o }}
        select_option: &sl_btn_select
          - action: input_text.set_value
            target:
              entity_id: "input_text.{{ this.entity_id.split('.')[1] }}"
            data:
              value: "{{ option }}"
      - name: "SL: LR Button 1 Long"
        unique_id: sl_living_room_b1_long_select
        default_entity_id: select.sl_living_room_b1_long
        icon: mdi:gesture-tap-button
        state: *sl_btn_state
        options: *sl_btn_options
        select_option: *sl_btn_select
