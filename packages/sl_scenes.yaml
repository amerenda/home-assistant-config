      # Scene list of the Lights tab: the scenes with the home room of
      # input_select.sl_room_selector (All Rooms: all scenes).
      - name: "SL: Selected Scene"
        unique_id: sl_scene_selected_select
        default_entity_id: select.sl_scene_selected
        icon: mdi:palette
        state: >-
          {% set room = states('input_select.sl_room_selector') %}
          {% set ns = namespace(o=[]) %}
          {% for s in state_attr('sensor.sl_scenes', 'scenes') or [] %}
          {% if room == 'All Rooms' or s.room == room %}{% set ns.o = ns.o + [s.name] %}{% endif %}
          {% endfor %}
          {% set v = states('input_text.sl_scene_selected') %}
          {{ v if v in ns.o else (ns.o[0] if ns.o else '(no scenes)') }}
        options: >-
          {% set room = states('input_select.sl_room_selector') %}
          {% set ns = namespace(o=[]) %}
          {% for s in state_attr('sensor.sl_scenes', 'scenes') or [] %}
          {% if room == 'All Rooms' or s.room == room %}{% set ns.o = ns.o + [s.name] %}{% endif %}
          {% endfor %}
          {{ ns.o if ns.o else ['(no scenes)'] }}
        select_option:
          - action: input_text.set_value
            target:
              entity_id: input_text.sl_scene_selected
            data:
              value: "{{ option }}"
