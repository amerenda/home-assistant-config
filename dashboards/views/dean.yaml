strategy:
  type: custom:mushroom-strategy
  options:
    # Hide unavailable entities and specific entity configurations
    card_options:
      # Camera cards - hide when privacy mode is enabled
      camera.bedroom_fluent:
        hidden: "{{ is_state('switch.bedroom_privacy_mode', 'on') }}"
      camera.living_room_fluent:
        hidden: "{{ is_state('switch.living_room_privacy_mode', 'on') }}"
      camera.kitchen_fluent:
        hidden: "{{ is_state('switch.kitchen_privacy_mode', 'on') }}"
      # Hide individual lights that duplicate single-member groups
      light.fixture:
        hidden: true
      light.bathroom_1:
        hidden: true
      light.hallway_1:
        hidden: true
      # AC units do not report indoor humidity (always unknown)
      sensor.151732605151026_indoor_humidity:
        hidden: true
      sensor.151732607639365_indoor_humidity:
        hidden: true
      # Living Room AC: diagnostics and settings (the thermostat card stays)
      sensor.151732605151026_error_code:
        hidden: true
      sensor.151732605151026_pmv:
        hidden: true
      sensor.151732605151026_outdoor_temperature:
        hidden: true
      sensor.151732605151026_realtime_power:
        hidden: true
      sensor.151732605151026_current_energy_consumption:
        hidden: true
      sensor.151732605151026_total_energy_consumption:
        hidden: true
      switch.151732605151026_eco_mode:
        hidden: true
      switch.151732605151026_screen_display:
        hidden: true
      switch.151732605151026_swing_vertical:
        hidden: true
      number.151732605151026_fan_speed:
        hidden: true
      fan.151732605151026_fresh_air:
        hidden: true
      binary_sensor.151732605151026_full_dust:
        hidden: true
      # Bedroom AC: diagnostics and settings (the thermostat card stays)
      sensor.151732607639365_compressor_power:
        hidden: true
      sensor.151732607639365_error_code:
        hidden: true
      sensor.151732607639365_indoor_fan_speed:
        hidden: true
      sensor.151732607639365_outdoor_temperature:
        hidden: true
      sensor.151732607639365_realtime_power:
        hidden: true
      sensor.151732607639365_current_energy_consumption:
        hidden: true
      sensor.151732607639365_total_energy_consumption:
        hidden: true
      switch.151732607639365_comfort_mode:
        hidden: true
      switch.151732607639365_degerming:
        hidden: true
      switch.151732607639365_dry:
        hidden: true
      switch.151732607639365_eco_mode:
        hidden: true
      switch.151732607639365_power:
        hidden: true
      switch.151732607639365_screen_display:
        hidden: true
      switch.151732607639365_sleep_mode:
        hidden: true
      switch.151732607639365_sound:
        hidden: true
      switch.151732607639365_swing_vertical:
        hidden: true
      fan.151732607639365_fresh_air:
        hidden: true
      binary_sensor.151732607639365_full_dust:
        hidden: true
      binary_sensor.151732607639365_water_pump_running:
        hidden: true
      # Home Assistant Voice satellites (device ids: Living Room, Kitchen)
      0e01ef821c0b956cae80a43b24c76490:
        hidden: true
      f1c82485d12b63c3ea6847a1ca666682:
        hidden: true
      # PTZ presets are in the Camera Controls card of each room
      select.living_room_living_room_ptz_preset:
        hidden: true
      select.bedroom_ptz_preset:
        hidden: true
      select.kitchen_ptz_preset:
        hidden: true
      # Hide PTZ and guard buttons, sirens, and motion/animal sensors for bedroom, living room and kitchen when unavailable
      # Bedroom entities
      button.bedroom_guard_go_to:
        hidden: true
      button.bedroom_ptz_down:
        hidden: true
      button.bedroom_ptz_left:
        hidden: true
      button.bedroom_ptz_right:
        hidden: true
      button.bedroom_ptz_up:
        hidden: true
      button.bedroom_ptz_stop:
        hidden: true
      siren.bedroom_siren:
        hidden: true
      binary_sensor.bedroom_animal:
        hidden: true
      binary_sensor.bedroom_motion:
        hidden: true
      binary_sensor.bedroom_baby_crying:
        hidden: true
      binary_sensor.bedroom_person:
        hidden: true

      # Living room entities
      button.living_room_guard_go_to:
        hidden: true
      button.living_room_ptz_down:
        hidden: true
      button.living_room_ptz_left:
        hidden: true
      button.living_room_ptz_right:
        hidden: true
      button.living_room_ptz_up:
        hidden: true
      button.living_room_ptz_stop:
        hidden: true
      siren.living_room_siren:
        hidden: true
      binary_sensor.living_room_animal:
        hidden: true
      binary_sensor.living_room_motion:
        hidden: true
      binary_sensor.living_room_baby_crying:
        hidden: true
      binary_sensor.living_room_person:
        hidden: true

      # Kitchen entities
      button.kitchen_guard_go_to:
        hidden: true
      button.kitchen_ptz_down:
        hidden: true
      button.kitchen_ptz_left:
        hidden: true
      button.kitchen_ptz_right:
        hidden: true
      button.kitchen_ptz_up:
        hidden: true
      button.kitchen_ptz_stop:
        hidden: true
      siren.kitchen_siren:
        hidden: true
      binary_sensor.kitchen_animal:
        hidden: true
      binary_sensor.kitchen_motion:
        hidden: true
      binary_sensor.kitchen_baby_crying:
        hidden: true
      binary_sensor.kitchen_person:
        hidden: true

    domains:
      _:
        hide_unavailable_entities: true
      default:
        hidden_domains:
          - calendar
          - todo
          - remote

    # Quick access cards (between greeting and area cards)
    # Extra cards (below area cards)
    extra_cards:
      - type: custom:mushroom-title-card
        title: Lights
      - type: custom:mushroom-template-card
        primary: All Lights
        secondary: >
          {% set on_count = [
            is_state('light.living_room', 'on'),
            is_state('light.bedroom', 'on'),
            is_state('light.bathroom', 'on'),
            is_state('light.kitchen', 'on'),
            is_state('light.hallway', 'on')
          ] | select('true') | list | count %}
          {{ on_count }} of 5 rooms on
        icon: mdi:lightbulb-group
        icon_color: >
          {% if is_state('light.living_room', 'on')
             or is_state('light.bedroom', 'on')
             or is_state('light.bathroom', 'on')
             or is_state('light.kitchen', 'on')
             or is_state('light.hallway', 'on') %}
            amber
          {% else %}
            disabled
          {% endif %}
        tap_action:
          action: call-service
          service: script.sl_toggle_all
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Morning
            icon: mdi:weather-sunset-up
            color: "{{ '#FFB74D' if is_state('sensor.sl_current_window', 'morning') else 'disabled' }}"
            vertical: true
            tap_action:
              action: perform-action
              perform_action: script.sl_all_rooms_scene
              data:
                window: morning
          - type: custom:mushroom-template-card
            primary: Day
            icon: mdi:weather-sunny
            color: "{{ '#FFB74D' if is_state('sensor.sl_current_window', 'day') else 'disabled' }}"
            vertical: true
            tap_action:
              action: perform-action
              perform_action: script.sl_all_rooms_scene
              data:
                window: day
          - type: custom:mushroom-template-card
            primary: Evening
            icon: mdi:weather-sunset-down
            color: "{{ '#FFB74D' if is_state('sensor.sl_current_window', 'evening') else 'disabled' }}"
            vertical: true
            tap_action:
              action: perform-action
              perform_action: script.sl_all_rooms_scene
              data:
                window: evening
          - type: custom:mushroom-template-card
            primary: Night
            icon: mdi:weather-night
            color: "{{ '#FFB74D' if is_state('sensor.sl_current_window', 'night') else 'disabled' }}"
            vertical: true
            tap_action:
              action: perform-action
              perform_action: script.sl_all_rooms_scene
              data:
                window: night

      - type: custom:mushroom-title-card
        title: Latest Pet Detection
      - type: conditional
        conditions:
          - entity: input_text.event_image_location
            state_not: ""
          - entity: input_text.event_image_location
            state_not: "unknown"
        card:
          type: markdown
          content: >
            {% set loc = states('input_text.event_image_location') %}
            {% set ts = states('input_text.event_image_timestamp') %}
            ![Pet](/local/pets/{{ loc }}_{{ ts }}.jpg)

    # Area configuration
    areas:
      living_room:
        name: Living Room
        icon: mdi:sofa
        icon_color: blue
        order: 1
        extra_cards:
          # Scene buttons: the room's window scenes and Button 4 cycle scenes
          # (sensor.sl_scenes). sl_room is read by the template as config.sl_room.
          - type: custom:auto-entities
            sl_room: Living Room
            show_empty: false
            card_param: cards
            card:
              type: grid
              title: Scenes
              columns: 4
              square: false
            filter:
              template: &sl_scene_buttons_tpl |-
                {%- set room = config.sl_room %}
                {%- set cur = states('sensor.sl_current_window') %}
                {%- set icons = {'morning': 'mdi:weather-sunset-up', 'day': 'mdi:weather-sunny', 'evening': 'mdi:weather-sunset-down', 'night': 'mdi:weather-night'} %}
                {%- set scenes = (state_attr('sensor.sl_scenes', 'scenes') or []) | selectattr('room', 'eq', room) | list %}
                {%- set ns = namespace(cards=[]) %}
                {%- for w in ['morning', 'day', 'evening', 'night'] %}
                {%- for s in scenes if s.window is defined and s.window == w %}
                {%- set ns.cards = ns.cards + [{'type': 'custom:mushroom-template-card', 'primary': w | title, 'icon': icons[w], 'color': '#FFB74D' if w == cur else 'disabled', 'vertical': true, 'tap_action': {'action': 'perform-action', 'perform_action': 'script.sl_scene_apply_name', 'data': {'name': s.name}}}] %}
                {%- endfor %}
                {%- endfor %}
                {%- for s in scenes if s.window is not defined and s.in_cycle %}
                {%- set ns.cards = ns.cards + [{'type': 'custom:mushroom-template-card', 'primary': s.name, 'icon': 'mdi:palette', 'color': 'disabled', 'vertical': true, 'tap_action': {'action': 'perform-action', 'perform_action': 'script.sl_scene_apply_name', 'data': {'name': s.name}}}] %}
                {%- endfor %}
                {{ ns.cards }}
          - type: conditional
            conditions:
              - entity: switch.living_room_privacy_mode
                state_not: "on"
            card:
              type: custom:auto-entities
              show_empty: false
              card:
                type: entities
                title: Camera Controls
                show_header_toggle: false
              filter:
                include:
                  - entity_id: button.living_room_guard_go_to
                  - entity_id: button.living_room_ptz_down
                  - entity_id: button.living_room_ptz_left
                  - entity_id: button.living_room_ptz_right
                  - entity_id: button.living_room_ptz_up
                  - entity_id: button.living_room_ptz_stop
                  - entity_id: siren.living_room_siren
                  - entity_id: binary_sensor.living_room_animal
                  - entity_id: binary_sensor.living_room_motion
                  - entity_id: binary_sensor.living_room_baby_crying
                  - entity_id: binary_sensor.living_room_person
                  - entity_id: select.living_room_living_room_ptz_preset
                exclude:
                  - state: "unavailable"
      kitchen:
        name: Kitchen
        icon: mdi:silverware-fork-knife
        icon_color: orange
        order: 2
        extra_cards:
          - type: custom:auto-entities
            sl_room: Kitchen
            show_empty: false
            card_param: cards
            card:
              type: grid
              title: Scenes
              columns: 4
              square: false
            filter:
              template: *sl_scene_buttons_tpl
          - type: conditional
            conditions:
              - entity: switch.kitchen_privacy_mode
                state_not: "on"
            card:
              type: custom:auto-entities
              show_empty: false
              card:
                type: entities
                title: Camera Controls
                show_header_toggle: false
              filter:
                include:
                  - entity_id: button.kitchen_guard_go_to
                  - entity_id: button.kitchen_ptz_down
                  - entity_id: button.kitchen_ptz_left
                  - entity_id: button.kitchen_ptz_right
                  - entity_id: button.kitchen_ptz_up
                  - entity_id: button.kitchen_ptz_stop
                  - entity_id: siren.kitchen_siren
                  - entity_id: binary_sensor.kitchen_animal
                  - entity_id: binary_sensor.kitchen_motion
                  - entity_id: binary_sensor.kitchen_baby_crying
                  - entity_id: binary_sensor.kitchen_person
                  - entity_id: select.kitchen_ptz_preset
                exclude:
                  - state: "unavailable"
      bathroom:
        name: Bathroom
        icon: mdi:shower
        icon_color: cyan
        order: 3
        extra_cards:
          - type: custom:auto-entities
            sl_room: Bathroom
            show_empty: false
            card_param: cards
            card:
              type: grid
              title: Scenes
              columns: 4
              square: false
            filter:
              template: *sl_scene_buttons_tpl
      bedroom:
        name: Bedroom
        icon: mdi:bed
        icon_color: purple
        order: 4
        extra_cards:
          - type: custom:auto-entities
            sl_room: Bedroom
            show_empty: false
            card_param: cards
            card:
              type: grid
              title: Scenes
              columns: 4
              square: false
            filter:
              template: *sl_scene_buttons_tpl
          - type: conditional
            conditions:
              - entity: switch.bedroom_privacy_mode
                state_not: "on"
            card:
              type: custom:auto-entities
              show_empty: false
              card:
                type: entities
                title: Camera Controls
                show_header_toggle: false
              filter:
                include:
                  - entity_id: button.bedroom_guard_go_to
                  - entity_id: button.bedroom_ptz_down
                  - entity_id: button.bedroom_ptz_left
                  - entity_id: button.bedroom_ptz_right
                  - entity_id: button.bedroom_ptz_up
                  - entity_id: button.bedroom_ptz_stop
                  - entity_id: siren.bedroom_siren
                  - entity_id: binary_sensor.bedroom_animal
                  - entity_id: binary_sensor.bedroom_motion
                  - entity_id: binary_sensor.bedroom_baby_crying
                  - entity_id: binary_sensor.bedroom_person
                  - entity_id: select.bedroom_ptz_preset
                exclude:
                  - state: "unavailable"
      hallway:
        name: Hallway
        icon: mdi:door-open
        icon_color: amber
        order: 5
        extra_cards:
          - type: custom:auto-entities
            sl_room: Hallway
            show_empty: false
            card_param: cards
            card:
              type: grid
              title: Scenes
              columns: 4
              square: false
            filter:
              template: *sl_scene_buttons_tpl
      # Hide the 'home' area card, but keep the main dashboard view
      home:
        hidden: true

    # View customizations
    views:
      # Customize default view
      home:
        title: Home
        icon: mdi:home
        path: home
      # Ensure switch view is visible
      switch:
        hidden: false


