title: Smart Lighting
views:
  # ════════════════════════════════════════════════════════════
  # Lights Tab (default): ad-hoc changes per bulb
  # ════════════════════════════════════════════════════════════
  - title: Lights
    path: lights
    icon: mdi:lightbulb-group
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_select.sl_room_selector
                name: Room
          - type: conditional
            conditions:
              - entity: input_select.sl_room_selector
                state: "Living Room"
            card:
              type: vertical-stack
              cards:
                - type: custom:hue-like-light-card
                  entity: light.living_room_1
                  title: Living Room
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
          - type: conditional
            conditions:
              - entity: input_select.sl_room_selector
                state: "Bedroom"
            card:
              type: vertical-stack
              cards:
                - type: custom:hue-like-light-card
                  entity: light.bedroom_1
                  title: Bedroom 1
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
                - type: custom:hue-like-light-card
                  entity: light.bedroom_2
                  title: Bedroom 2
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
                - type: custom:hue-like-light-card
                  entity: light.lamp_1
                  title: Lamp
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
          - type: conditional
            conditions:
              - entity: input_select.sl_room_selector
                state: "Bathroom"
            card:
              type: vertical-stack
              cards:
                - type: custom:hue-like-light-card
                  entity: light.bathroom_1
                  title: Bathroom
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
          - type: conditional
            conditions:
              - entity: input_select.sl_room_selector
                state: "Kitchen"
            card:
              type: vertical-stack
              cards:
                - type: custom:hue-like-light-card
                  entity: light.kitchen_1
                  title: Kitchen 1
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
                - type: custom:hue-like-light-card
                  entity: light.kitchen_2
                  title: Kitchen 2
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
          - type: conditional
            conditions:
              - entity: input_select.sl_room_selector
                state: "Hallway"
            card:
              type: vertical-stack
              cards:
                - type: custom:hue-like-light-card
                  entity: light.hallway_1
                  title: Hallway
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
          - type: conditional
            conditions:
              - entity: input_select.sl_room_selector
                state: "All Rooms"
            card:
              type: vertical-stack
              cards:
                - type: custom:mushroom-title-card
                  title: Living Room
                - type: custom:hue-like-light-card
                  entity: light.living_room_1
                  title: Living Room
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
                - type: custom:mushroom-title-card
                  title: Bedroom
                - type: custom:hue-like-light-card
                  entity: light.bedroom_1
                  title: Bedroom 1
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
                - type: custom:hue-like-light-card
                  entity: light.bedroom_2
                  title: Bedroom 2
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
                - type: custom:hue-like-light-card
                  entity: light.lamp_1
                  title: Lamp
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
                - type: custom:mushroom-title-card
                  title: Bathroom
                - type: custom:hue-like-light-card
                  entity: light.bathroom_1
                  title: Bathroom
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
                - type: custom:mushroom-title-card
                  title: Kitchen
                - type: custom:hue-like-light-card
                  entity: light.kitchen_1
                  title: Kitchen 1
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
                - type: custom:hue-like-light-card
                  entity: light.kitchen_2
                  title: Kitchen 2
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
                - type: custom:mushroom-title-card
                  title: Hallway
                - type: custom:hue-like-light-card
                  entity: light.hallway_1
                  title: Hallway
                  showSwitch: false
                  scenes: []
                  slider: default
                  onClickAction: hue-screen
                  offClickAction: hue-screen
          # ── Scenes: the scenes of the selected room ──────────────
          - type: custom:mushroom-title-card
            title: Scenes
            subtitle: Set the lights above, then save them as a named scene.
          - type: markdown
            content: |
              {%- set room = states('input_select.sl_room_selector') %}
              {%- set ns = namespace(n=0) %}
              {%- for s in state_attr('sensor.sl_scenes', 'scenes') or [] %}
              {%- if room == 'All Rooms' or s.room == room %}
              {%- set ns.n = ns.n + 1 %}
              - **{{ s.name }}**{{ ' (' ~ s.room ~ ')' if room == 'All Rooms' else '' }}: {{ s.lights | count }} bulbs, Button 4 cycle {{ 'on' if s.in_cycle else 'off' }}
              {%- endif %}
              {%- endfor %}
              {%- if ns.n == 0 %}
              No scenes for this room.
              {%- endif %}
              {%- set r = state_attr('sensor.sl_scenes', 'last_result') %}
              {%- if r and not r.ok %}

              **Last command failed:** {{ r.op }} '{{ r.name }}': {{ r.error }}
              {%- endif %}
          - type: conditional
            conditions:
              - entity: input_select.sl_room_selector
                state_not: "All Rooms"
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: "**Window scenes in the Button 4 cycle** (tap to change)"
                - type: horizontal-stack
                  cards:
                    - type: custom:mushroom-template-card
                      primary: Morning
                      secondary: >
                        {% set f = (state_attr('sensor.sl_scenes', 'window_cycle') or {}).get(states('input_select.sl_room_selector'), {}) %}
                        {{ 'In cycle' if f.get('morning', true) else 'Not in cycle' }}
                      icon: mdi:weather-sunset-up
                      icon_color: >
                        {% set f = (state_attr('sensor.sl_scenes', 'window_cycle') or {}).get(states('input_select.sl_room_selector'), {}) %}
                        {{ 'amber' if f.get('morning', true) else 'disabled' }}
                      layout: vertical
                      tap_action:
                        action: call-service
                        service: script.sl_scene_window_cycle_toggle
                        data:
                          window: morning
                    - type: custom:mushroom-template-card
                      primary: Day
                      secondary: >
                        {% set f = (state_attr('sensor.sl_scenes', 'window_cycle') or {}).get(states('input_select.sl_room_selector'), {}) %}
                        {{ 'In cycle' if f.get('day', true) else 'Not in cycle' }}
                      icon: mdi:weather-sunny
                      icon_color: >
                        {% set f = (state_attr('sensor.sl_scenes', 'window_cycle') or {}).get(states('input_select.sl_room_selector'), {}) %}
                        {{ 'amber' if f.get('day', true) else 'disabled' }}
                      layout: vertical
                      tap_action:
                        action: call-service
                        service: script.sl_scene_window_cycle_toggle
                        data:
                          window: day
                    - type: custom:mushroom-template-card
                      primary: Evening
                      secondary: >
                        {% set f = (state_attr('sensor.sl_scenes', 'window_cycle') or {}).get(states('input_select.sl_room_selector'), {}) %}
                        {{ 'In cycle' if f.get('evening', true) else 'Not in cycle' }}
                      icon: mdi:weather-sunset-down
                      icon_color: >
                        {% set f = (state_attr('sensor.sl_scenes', 'window_cycle') or {}).get(states('input_select.sl_room_selector'), {}) %}
                        {{ 'amber' if f.get('evening', true) else 'disabled' }}
                      layout: vertical
                      tap_action:
                        action: call-service
                        service: script.sl_scene_window_cycle_toggle
                        data:
                          window: evening
                    - type: custom:mushroom-template-card
                      primary: Night
                      secondary: >
                        {% set f = (state_attr('sensor.sl_scenes', 'window_cycle') or {}).get(states('input_select.sl_room_selector'), {}) %}
                        {{ 'In cycle' if f.get('night', true) else 'Not in cycle' }}
                      icon: mdi:weather-night
                      icon_color: >
                        {% set f = (state_attr('sensor.sl_scenes', 'window_cycle') or {}).get(states('input_select.sl_room_selector'), {}) %}
                        {{ 'amber' if f.get('night', true) else 'disabled' }}
                      layout: vertical
                      tap_action:
                        action: call-service
                        service: script.sl_scene_window_cycle_toggle
                        data:
                          window: night
          - type: entities
            show_header_toggle: false
            entities:
              - entity: select.sl_scene_selected
                name: Scene
          - type: horizontal-stack
            cards:
              - type: button
                name: Apply
                icon: mdi:play
                show_state: false
                tap_action:
                  action: call-service
                  service: script.sl_scene_apply
              - type: button
                name: Cycle on/off
                icon: mdi:rotate-right
                show_state: false
                tap_action:
                  action: call-service
                  service: script.sl_scene_toggle_cycle
              - type: button
                name: Edit
                icon: mdi:pencil
                show_state: false
                tap_action:
                  action: call-service
                  service: script.sl_scene_load
              - type: button
                name: Delete
                icon: mdi:delete
                show_state: false
                tap_action:
                  action: call-service
                  service: script.sl_scene_delete
                  confirmation:
                    text: Delete the selected scene? A button action that uses it then does nothing.
          - type: conditional
            conditions:
              - entity: input_boolean.sl_show_save_scene
                state: "off"
            card:
              type: button
              name: New scene from the current lights
              icon: mdi:plus
              show_state: false
              tap_action:
                action: call-service
                service: script.sl_scene_form_new
          - type: conditional
            conditions:
              - entity: input_boolean.sl_show_save_scene
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: entities
                  title: Save scene
                  show_header_toggle: false
                  entities:
                    - entity: input_text.sl_scene_name
                      name: Name
                    - entity: input_select.sl_scene_room
                      name: Home room (the scene shows in this room)
                    - entity: input_boolean.sl_scene_in_cycle
                      name: In the Button 4 cycle of the home room
                    - type: section
                      label: Bulbs in the scene (current settings)
                    - entity: input_boolean.sl_scene_bulb_living_room_1
                      name: Living Room
                    - entity: input_boolean.sl_scene_bulb_bedroom_1
                      name: Bedroom 1
                    - entity: input_boolean.sl_scene_bulb_bedroom_2
                      name: Bedroom 2
                    - entity: input_boolean.sl_scene_bulb_lamp_1
                      name: Bedroom Lamp
                    - entity: input_boolean.sl_scene_bulb_bathroom_1
                      name: Bathroom
                    - entity: input_boolean.sl_scene_bulb_kitchen_1
                      name: Kitchen 1
                    - entity: input_boolean.sl_scene_bulb_kitchen_2
                      name: Kitchen 2
                    - entity: input_boolean.sl_scene_bulb_hallway_1
                      name: Hallway
                - type: horizontal-stack
                  cards:
                    - type: button
                      name: Save
                      icon: mdi:content-save
                      show_state: false
                      tap_action:
                        action: call-service
                        service: script.sl_scene_save
                        confirmation:
                          text: Save the current settings of the checked bulbs as this scene? A scene with the same name is replaced.
                    - type: button
                      name: Cancel
                      icon: mdi:close
                      show_state: false
                      tap_action:
                        action: call-service
                        service: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.sl_show_save_scene

  - title: Settings
    path: schedule
    icon: mdi:cog
    cards:
      # ── Top Bar ────────────────────────────────────────────
      - type: entities
        entities:
          - entity: input_boolean.sl_enabled
            name: Smart Lighting
          - entity: sensor.sl_current_window
            name: Current Window
          - entity: input_select.sl_house_mode
            name: House Mode
          - entity: sensor.sl_z2m_sync_status
            name: Z2M Sync

      # ── Schedule (collapsible) ─────────────────────────────
      - type: entities
        entities:
          - entity: input_boolean.sl_show_schedule
            name: Edit Schedule
            icon: mdi:clock-edit-outline

      - type: conditional
        conditions:
          - entity: input_boolean.sl_show_schedule
            state: "on"
        card:
          type: vertical-stack
          cards:
            # Day → Profile assignment
            - type: entities
              title: Day Profiles
              show_header_toggle: false
              entities:
                - entity: input_select.sl_profile_monday
                  name: Monday
                - entity: input_select.sl_profile_tuesday
                  name: Tuesday
                - entity: input_select.sl_profile_wednesday
                  name: Wednesday
                - entity: input_select.sl_profile_thursday
                  name: Thursday
                - entity: input_select.sl_profile_friday
                  name: Friday
                - entity: input_select.sl_profile_saturday
                  name: Saturday
                - entity: input_select.sl_profile_sunday
                  name: Sunday
            # Profile schedules
            - type: entities
              title: "Weekday Profile"
              show_header_toggle: false
              entities:
                - entity: input_datetime.sl_morning_start_weekday
                  name: Morning
                - entity: input_datetime.sl_day_start_weekday
                  name: Day
                - entity: input_datetime.sl_evening_start_weekday
                  name: Evening
                - entity: input_datetime.sl_night_start_weekday
                  name: Night
            - type: entities
              title: "Friday Profile"
              show_header_toggle: false
              entities:
                - entity: input_datetime.sl_morning_start_friday
                  name: Morning
                - entity: input_datetime.sl_day_start_friday
                  name: Day
                - entity: input_datetime.sl_evening_start_friday
                  name: Evening
                - entity: input_datetime.sl_night_start_friday
                  name: Night
            - type: entities
              title: "Saturday Profile"
              show_header_toggle: false
              entities:
                - entity: input_datetime.sl_morning_start_saturday
                  name: Morning
                - entity: input_datetime.sl_day_start_saturday
                  name: Day
                - entity: input_datetime.sl_evening_start_saturday
                  name: Evening
                - entity: input_datetime.sl_night_start_saturday
                  name: Night
            - type: entities
              title: "Sunday Profile"
              show_header_toggle: false
              entities:
                - entity: input_datetime.sl_morning_start_sunday
                  name: Morning
                - entity: input_datetime.sl_day_start_sunday
                  name: Day
                - entity: input_datetime.sl_evening_start_sunday
                  name: Evening
                - entity: input_datetime.sl_night_start_sunday
                  name: Night

      # ── Room Selector ──────────────────────────────────────
      - type: entities
        title: Room Settings
        entities:
          - entity: input_select.sl_room_selector
            name: Room

      - type: button
        name: Apply Changes (Push Config to Z2M)
        icon: mdi:upload-network-outline
        show_state: false
        tap_action:
          action: call-service
          service: script.sl_push_config

      # ── Room Settings: Bathroom ────────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Bathroom"
        card:
          type: entities
          show_header_toggle: false
          entities:
            - type: section
              label: "Motion (Sleep Mode)"
            - entity: input_boolean.sl_bathroom_motion_night
              name: Allow wall-switch power-on at night
            - type: section
              label: Settings
            - entity: input_boolean.sl_bathroom_smart_power_on
              name: Smart Wall Switch
            - entity: input_boolean.sl_bathroom_auto_transition
              name: Auto Transition
            - entity: input_boolean.sl_bathroom_smooth_transition
              name: Smooth Transition
            - entity: input_number.sl_bathroom_smooth_transition_duration
              name: Transition Duration (min)

      # ── Room Settings: Bedroom ─────────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Bedroom"
        card:
          type: entities
          show_header_toggle: false
          entities:
            - type: section
              label: "Motion (Sleep Mode)"
            - entity: input_boolean.sl_bedroom_motion_night
              name: Allow wall-switch power-on at night
            - type: section
              label: Settings
            - entity: input_boolean.sl_bedroom_smart_power_on
              name: Smart Wall Switch
            - entity: input_boolean.sl_bedroom_auto_transition
              name: Auto Transition
            - entity: input_boolean.sl_bedroom_smooth_transition
              name: Smooth Transition
            - entity: input_number.sl_bedroom_smooth_transition_duration
              name: Transition Duration (min)


      # ── Room Settings: Hallway ─────────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Hallway"
        card:
          type: entities
          show_header_toggle: false
          entities:
            - type: section
              label: "Motion (Sleep Mode)"
            - entity: input_boolean.sl_hallway_motion_night
              name: Allow wall-switch power-on at night
            - type: section
              label: Settings
            - entity: input_boolean.sl_hallway_smart_power_on
              name: Smart Wall Switch
            - entity: input_boolean.sl_hallway_auto_transition
              name: Auto Transition
            - entity: input_boolean.sl_hallway_smooth_transition
              name: Smooth Transition
            - entity: input_number.sl_hallway_smooth_transition_duration
              name: Transition Duration (min)

      # ── Room Settings: Kitchen ─────────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Kitchen"
        card:
          type: entities
          show_header_toggle: false
          entities:
            - type: section
              label: "Motion (Sleep Mode)"
            - entity: input_boolean.sl_kitchen_motion_night
              name: Allow wall-switch power-on at night
            - type: section
              label: Settings
            - entity: input_boolean.sl_kitchen_smart_power_on
              name: Smart Wall Switch
            - entity: input_boolean.sl_kitchen_auto_transition
              name: Auto Transition
            - entity: input_boolean.sl_kitchen_smooth_transition
              name: Smooth Transition
            - entity: input_number.sl_kitchen_smooth_transition_duration
              name: Transition Duration (min)

      # ── Room Settings: Living Room ─────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Living Room"
        card:
          type: entities
          show_header_toggle: false
          entities:
            - type: section
              label: "Motion (Sleep Mode)"
            - entity: input_boolean.sl_living_room_motion_night
              name: Allow wall-switch power-on at night
            - type: section
              label: Settings
            - entity: input_boolean.sl_living_room_smart_power_on
              name: Smart Wall Switch
            - entity: input_boolean.sl_living_room_auto_transition
              name: Auto Transition
            - entity: input_boolean.sl_living_room_smooth_transition
              name: Smooth Transition
            - entity: input_number.sl_living_room_smooth_transition_duration
              name: Transition Duration (min)

  # ════════════════════════════════════════════════════════════
  # Scene Editor Tab
  # ════════════════════════════════════════════════════════════
  - title: Scene Editor
    path: scenes
    icon: mdi:palette
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_select.sl_room_selector
            name: Room

      # ── Living Room ─────────────────────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Living Room"
        card:
          type: vertical-stack
          cards:
            - type: custom:hue-like-light-card
              entity: light.living_room_1
              title: Light
              showSwitch: false
              slider: default
              onClickAction: hue-screen
              offClickAction: hue-screen
            - type: custom:mushroom-title-card
              title: Load Stored Scene
              subtitle: Applies stored values to lights as a starting point
            - type: horizontal-stack
              cards:
                - type: button
                  name: Morning
                  icon: mdi:weather-sunset-up
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_scene
                    data:
                      room: living_room
                      window: morning
                - type: button
                  name: Day
                  icon: mdi:weather-sunny
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_scene
                    data:
                      room: living_room
                      window: day
                - type: button
                  name: Evening
                  icon: mdi:weather-sunset-down
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_scene
                    data:
                      room: living_room
                      window: evening
                - type: button
                  name: Night
                  icon: mdi:weather-night
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_scene
                    data:
                      room: living_room
                      window: night
            - type: custom:mushroom-title-card
              title: Save Current State
            - type: horizontal-stack
              cards:
                - type: button
                  name: As Morning
                  icon: mdi:content-save
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_save_current_as_scene
                    data:
                      room: living_room
                      window: morning
                - type: button
                  name: As Day
                  icon: mdi:content-save
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_save_current_as_scene
                    data:
                      room: living_room
                      window: day
                - type: button
                  name: As Evening
                  icon: mdi:content-save
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_save_current_as_scene
                    data:
                      room: living_room
                      window: evening
                - type: button
                  name: As Night
                  icon: mdi:content-save
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_save_current_as_scene
                    data:
                      room: living_room
                      window: night
            - type: markdown
              content: >
                **Wall switch power-on only.** Captures current brightness/color as the bulb's
                mains-power-on default — what the bulb wakes to when a wall switch cuts and
                restores power. Has no effect on Hue dimmer button-1 (handled by Z2M scene recall)
                or on scene windows.
            - type: button
              name: Save as Firmware Default (Wall Switch)
              icon: mdi:electric-switch
              show_state: false
              tap_action:
                action: call-service
                service: script.set_bulb_defaults
                data:
                  room: living_room

      # ── Bedroom ─────────────────────────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Bedroom"
        card:
          type: vertical-stack
          cards:
            - type: custom:hue-like-light-card
              entities:
                - light.bedroom_1
                - light.bedroom_2
                - light.lamp_1
              title: All Lights
              showSwitch: false
              slider: default
              onClickAction: hue-screen
              offClickAction: hue-screen
            - type: custom:mushroom-title-card
              title: Load Stored Scene
              subtitle: Applies stored values to lights as a starting point
            - type: horizontal-stack
              cards:
                - type: button
                  name: Morning
                  icon: mdi:weather-sunset-up
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_scene
                    data:
                      room: bedroom
                      window: morning
                - type: button
                  name: Day
                  icon: mdi:weather-sunny
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_scene
                    data:
                      room: bedroom
                      window: day
                - type: button
                  name: Evening
                  icon: mdi:weather-sunset-down
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_scene
