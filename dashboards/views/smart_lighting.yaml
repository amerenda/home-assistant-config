  # ════════════════════════════════════════════════════════════
  - title: Switches
    path: switches
    icon: mdi:light-switch
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_select.sl_room_selector
            name: Room

      - type: markdown
        content: |
          **Button 1 (top):** Short = toggle on/off, Long = power off all
          **Button 2:** Short = brightness up, Long = brightness max
          **Button 3:** Short = brightness down, Long = brightness min
          **Button 4 (bottom):** Short = cycle scenes (the window scenes and the scenes of this room with the cycle flag on; set them on the Lights tab), Long = toggles all lights on/off by default. Any button can be set below to a named scene ("Scene: <name>").

