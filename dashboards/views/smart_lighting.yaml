  # Switch Config Tab
  # ════════════════════════════════════════════════════════════
  - title: Button Config
    path: switches
    icon: mdi:light-switch
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_select.sl_room_selector
            name: Room

      - type: markdown
        content: |
          **Button 1 (top):** Short = toggle on/off, Long = power off all
          **Button 2:** Short = brightness up, Long = brightness max
          **Button 3:** Short = brightness down, Long = brightness min
          **Button 4 (bottom):** Short = cycle scenes (the 4 window scenes, then the scenes of this room with the cycle flag on; set them on the Scene Config tab), Long = toggles all lights on/off by default. Any button can be set below to a named scene ("Scene: <name>").
          **Window scenes:** each window of a room uses its own window scene ('<Room> <Window>', Default), or the scene that you select here. Only the bulbs of the room are used, with no effect.

      # ── Window scene slots (WO-0274) ────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Living Room"
        card:
          type: entities
