title: Smart Lighting
views:
  # ════════════════════════════════════════════════════════════
  # Lights Tab (default): set the lights of a room, back to the window scene,
  # save the lights as a scene (WO-0274)
  # ════════════════════════════════════════════════════════════
  - title: Lights
    path: lights
    icon: mdi:lightbulb-group
    cards:
      - type: vertical-stack
        cards:
          - &sl_room_dropdown
            type: entities
            show_header_toggle: false
            entities:
              - entity: input_select.sl_room_selector
                name: Room
          - &sl_room_lights
            type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - entity: input_select.sl_room_selector
                    state: "Living Room"
                card:
                  type: vertical-stack
                  cards:
                    - type: custom:hue-like-light-card
                      entity: light.living_room_1
                      title: Living Room
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
              - type: conditional
                conditions:
                  - entity: input_select.sl_room_selector
                    state: "Bedroom"
                card:
                  type: vertical-stack
                  cards:
                    - type: custom:hue-like-light-card
                      entity: light.bedroom_1
                      title: Bedroom 1
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
                    - type: custom:hue-like-light-card
                      entity: light.bedroom_2
                      title: Bedroom 2
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
                    - type: custom:hue-like-light-card
                      entity: light.lamp_1
                      title: Lamp
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
              - type: conditional
                conditions:
                  - entity: input_select.sl_room_selector
                    state: "Bathroom"
                card:
                  type: vertical-stack
                  cards:
                    - type: custom:hue-like-light-card
                      entity: light.bathroom_1
                      title: Bathroom
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
              - type: conditional
                conditions:
                  - entity: input_select.sl_room_selector
                    state: "Kitchen"
                card:
                  type: vertical-stack
                  cards:
                    - type: custom:hue-like-light-card
                      entity: light.kitchen_1
                      title: Kitchen 1
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
                    - type: custom:hue-like-light-card
                      entity: light.kitchen_2
                      title: Kitchen 2
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
              - type: conditional
                conditions:
                  - entity: input_select.sl_room_selector
                    state: "Hallway"
                card:
                  type: vertical-stack
                  cards:
                    - type: custom:hue-like-light-card
                      entity: light.hallway_1
                      title: Hallway
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
              - type: conditional
                conditions:
                  - entity: input_select.sl_room_selector
                    state: "All Rooms"
                card:
                  type: vertical-stack
                  cards:
                    - type: custom:mushroom-title-card
                      title: Living Room
                    - type: custom:hue-like-light-card
                      entity: light.living_room_1
                      title: Living Room
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
                    - type: custom:mushroom-title-card
                      title: Bedroom
                    - type: custom:hue-like-light-card
                      entity: light.bedroom_1
                      title: Bedroom 1
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
                    - type: custom:hue-like-light-card
                      entity: light.bedroom_2
                      title: Bedroom 2
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
                    - type: custom:hue-like-light-card
                      entity: light.lamp_1
                      title: Lamp
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
                    - type: custom:mushroom-title-card
                      title: Bathroom
                    - type: custom:hue-like-light-card
                      entity: light.bathroom_1
                      title: Bathroom
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
                    - type: custom:mushroom-title-card
                      title: Kitchen
                    - type: custom:hue-like-light-card
                      entity: light.kitchen_1
                      title: Kitchen 1
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
                    - type: custom:hue-like-light-card
                      entity: light.kitchen_2
                      title: Kitchen 2
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
                    - type: custom:mushroom-title-card
                      title: Hallway
                    - type: custom:hue-like-light-card
                      entity: light.hallway_1
                      title: Hallway
                      showSwitch: false
                      scenes: []
                      slider: default
                      onClickAction: hue-screen
                      offClickAction: hue-screen
          - type: horizontal-stack
            cards:
              - type: button
                name: Back to window scene
                icon: mdi:clock-time-four-outline
                show_state: false
                tap_action:
                  action: call-service
                  service: script.sl_scene_back_to_window
              - type: button
                name: Save as scene
                icon: mdi:content-save-plus
                show_state: false
                tap_action:
                  action: call-service
                  service: script.sl_scene_form_new
          - &sl_scene_save_form
            type: conditional
            conditions:
              - entity: input_boolean.sl_show_save_scene
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: entities
                  title: Save scene
                  show_header_toggle: false
                  entities:
                    - entity: input_text.sl_scene_name
                      name: Name
                    - entity: input_select.sl_scene_room
                      name: Home room (the scene shows in this room)
                    - entity: input_boolean.sl_scene_in_cycle
                      name: In the Button 4 cycle of the home room
                    - type: section
                      label: Bulbs in the scene (current settings)
                    - entity: input_boolean.sl_scene_bulb_living_room_1
                      name: Living Room
                    - entity: input_boolean.sl_scene_bulb_bedroom_1
                      name: Bedroom 1
                    - entity: input_boolean.sl_scene_bulb_bedroom_2
                      name: Bedroom 2
                    - entity: input_boolean.sl_scene_bulb_lamp_1
                      name: Bedroom Lamp
                    - entity: input_boolean.sl_scene_bulb_bathroom_1
                      name: Bathroom
                    - entity: input_boolean.sl_scene_bulb_kitchen_1
                      name: Kitchen 1
                    - entity: input_boolean.sl_scene_bulb_kitchen_2
                      name: Kitchen 2
                    - entity: input_boolean.sl_scene_bulb_hallway_1
                      name: Hallway
                - type: horizontal-stack
                  cards:
                    - type: button
                      name: Save
                      icon: mdi:content-save
                      show_state: false
                      tap_action:
                        action: call-service
                        service: script.sl_scene_save
                        confirmation:
                          text: Save the current settings of the checked bulbs as this scene? A scene with the same name is replaced.
                    - type: button
                      name: Cancel
                      icon: mdi:close
                      show_state: false
                      tap_action:
                        action: call-service
                        service: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.sl_show_save_scene

  # ════════════════════════════════════════════════════════════
  # Scene Config Tab (WO-0274): the scenes of a room, with effects
  # The window scenes ('<Room> <Window>') are scenes too: Edit, adjust, Save.
  # ════════════════════════════════════════════════════════════
  - title: Scene Config
    path: scenes
    icon: mdi:palette
    cards:
      - type: vertical-stack
        cards:
          - *sl_room_dropdown
          - type: markdown
            content: |
              {%- set room = states('input_select.sl_room_selector') %}
              {%- set ns = namespace(n=0) %}
              {%- for s in state_attr('sensor.sl_scenes', 'scenes') or [] %}
              {%- if room == 'All Rooms' or s.room == room %}
              {%- set ns.n = ns.n + 1 %}
              - **{{ s.name }}**{{ ' (' ~ s.room ~ ')' if room == 'All Rooms' else '' }}: {{ s.lights | count }} bulbs, {{ 'window scene (always in the Button 4 cycle)' if s.window is defined else 'Button 4 cycle ' ~ ('on' if s.in_cycle else 'off') }}{{ ', effects' if s.lights.values() | selectattr('effect', 'defined') | list | count > 0 else '' }}
              {%- endif %}
              {%- endfor %}
              {%- if ns.n == 0 %}
              No scenes for this room.
              {%- endif %}
              {%- set r = state_attr('sensor.sl_scenes', 'last_result') %}
              {%- if r and not r.ok %}

              **Last command failed:** {{ r.op }} '{{ r.name }}': {{ r.error }}
              {%- endif %}
          - type: entities
            show_header_toggle: false
            entities:
              - entity: select.sl_scene_selected
                name: Scene
          - type: horizontal-stack
            cards:
              - type: button
                name: Apply
                icon: mdi:play
                show_state: false
                tap_action:
                  action: call-service
                  service: script.sl_scene_apply
              - type: button
                name: Cycle on/off
                icon: mdi:rotate-right
                show_state: false
                tap_action:
                  action: call-service
                  service: script.sl_scene_toggle_cycle
              - type: button
                name: Edit
                icon: mdi:pencil
                show_state: false
                tap_action:
                  action: call-service
                  service: script.sl_scene_load
              - type: button
                name: Delete
                icon: mdi:delete
                show_state: false
                tap_action:
                  action: call-service
                  service: script.sl_scene_delete
                  confirmation:
                    text: Delete the selected scene? A button action that uses it then does nothing.
          - &sl_scene_new_button
            type: conditional
            conditions:
              - entity: input_boolean.sl_show_save_scene
                state: "off"
            card:
              type: button
              name: New scene from the current lights
              icon: mdi:plus
              show_state: false
              tap_action:
                action: call-service
                service: script.sl_scene_form_new
          - type: markdown
            content: >-
              Edit applies the scene and opens the save form. Adjust the lights below,
              then Save with the same name. A window scene ('<Room> <Window>') is used
              from the next time that window turns the lights on.
          - *sl_room_lights
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_boolean.sl_scene_effects
                name: This scene has effects
          - type: conditional
            conditions:
              - entity: input_boolean.sl_scene_effects
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: conditional
                  conditions:
                    - entity: input_select.sl_room_selector
                      state: "Living Room"
                  card:
                    type: vertical-stack
                    cards:
                      - &sl_fx_living_room_1
                        type: vertical-stack
                        cards:
                          - type: tile
                            entity: select.sl_fx_living_room_1
                            name: Living Room effect
                            icon: mdi:auto-fix
                            vertical: false
                            features_position: bottom
                            features:
                              - type: select-options
                                options: &sl_fx_color [none, candle, fireplace, colorloop, sunset, sunrise, sparkle, opal, glisten, underwater, cosmos, sunbeam, enchant, breathe]
                          - type: tile
                            entity: light.sl_fx_color_living_room_1
                            name: Living Room color (tap for the color wheel)
                            icon: mdi:palette
                            tap_action:
                              action: more-info
                            icon_tap_action:
                              action: more-info
                          - type: tile
                            entity: input_number.sl_fx_speed_living_room_1
                            name: Living Room speed (0 slow, 1 fast)
                            features_position: bottom
                            features:
                              - type: numeric-input
                                style: slider
                          - type: tile
                            entity: light.living_room_1
                            name: Living Room brightness
                            features_position: bottom
                            features:
                              - type: light-brightness
                - type: conditional
                  conditions:
                    - entity: input_select.sl_room_selector
                      state: "Bedroom"
                  card:
                    type: vertical-stack
                    cards:
                      - &sl_fx_bedroom_1
                        type: vertical-stack
                        cards:
                          - type: tile
                            entity: select.sl_fx_bedroom_1
                            name: Bedroom 1 effect
                            icon: mdi:auto-fix
                            vertical: false
                            features_position: bottom
                            features:
                              - type: select-options
                                options: *sl_fx_color
                          - type: tile
                            entity: light.sl_fx_color_bedroom_1
                            name: Bedroom 1 color (tap for the color wheel)
                            icon: mdi:palette
                            tap_action:
                              action: more-info
                            icon_tap_action:
                              action: more-info
                          - type: tile
                            entity: input_number.sl_fx_speed_bedroom_1
                            name: Bedroom 1 speed (0 slow, 1 fast)
                            features_position: bottom
                            features:
                              - type: numeric-input
                                style: slider
                          - type: tile
                            entity: light.bedroom_1
                            name: Bedroom 1 brightness
                            features_position: bottom
                            features:
                              - type: light-brightness
                      - &sl_fx_bedroom_2
                        type: vertical-stack
                        cards:
                          - type: tile
                            entity: select.sl_fx_bedroom_2
                            name: Bedroom 2 effect
                            icon: mdi:auto-fix
                            vertical: false
                            features_position: bottom
                            features:
                              - type: select-options
                                options: *sl_fx_color
                          - type: tile
                            entity: light.sl_fx_color_bedroom_2
                            name: Bedroom 2 color (tap for the color wheel)
                            icon: mdi:palette
                            tap_action:
                              action: more-info
                            icon_tap_action:
                              action: more-info
                          - type: tile
                            entity: input_number.sl_fx_speed_bedroom_2
                            name: Bedroom 2 speed (0 slow, 1 fast)
                            features_position: bottom
                            features:
                              - type: numeric-input
                                style: slider
                          - type: tile
                            entity: light.bedroom_2
                            name: Bedroom 2 brightness
                            features_position: bottom
                            features:
                              - type: light-brightness
                      - &sl_fx_lamp_1
                        type: vertical-stack
                        cards:
                          - type: tile
                            entity: select.sl_fx_lamp_1
                            name: Bedroom Lamp effect
                            icon: mdi:auto-fix
                            vertical: false
                            features_position: bottom
                            features:
                              - type: select-options
                                options: *sl_fx_color
                          - type: tile
                            entity: light.sl_fx_color_lamp_1
                            name: Bedroom Lamp color (tap for the color wheel)
                            icon: mdi:palette
                            tap_action:
                              action: more-info
                            icon_tap_action:
                              action: more-info
                          - type: tile
                            entity: input_number.sl_fx_speed_lamp_1
                            name: Bedroom Lamp speed (0 slow, 1 fast)
                            features_position: bottom
                            features:
                              - type: numeric-input
                                style: slider
                          - type: tile
                            entity: light.lamp_1
                            name: Bedroom Lamp brightness
                            features_position: bottom
                            features:
                              - type: light-brightness
                - type: conditional
                  conditions:
                    - entity: input_select.sl_room_selector
                      state: "Bathroom"
                  card:
                    type: vertical-stack
                    cards:
                      - &sl_fx_bathroom_1
                        type: vertical-stack
                        cards:
                          - type: tile
                            entity: select.sl_fx_bathroom_1
                            name: Bathroom effect
                            icon: mdi:auto-fix
                            vertical: false
                            features_position: bottom
                            features:
                              - type: select-options
                                options: *sl_fx_color
                          - type: tile
                            entity: light.sl_fx_color_bathroom_1
                            name: Bathroom color (tap for the color wheel)
                            icon: mdi:palette
                            tap_action:
                              action: more-info
                            icon_tap_action:
                              action: more-info
                          - type: tile
                            entity: input_number.sl_fx_speed_bathroom_1
                            name: Bathroom speed (0 slow, 1 fast)
                            features_position: bottom
                            features:
                              - type: numeric-input
                                style: slider
                          - type: tile
                            entity: light.bathroom_1
                            name: Bathroom brightness
                            features_position: bottom
                            features:
                              - type: light-brightness
                - type: conditional
                  conditions:
                    - entity: input_select.sl_room_selector
                      state: "Kitchen"
                  card:
                    type: vertical-stack
                    cards:
                      - &sl_fx_kitchen_1
                        type: vertical-stack
                        cards:
                          - type: tile
                            entity: select.sl_fx_kitchen_1
                            name: Kitchen 1 effect
                            icon: mdi:auto-fix
                            vertical: false
                            features_position: bottom
                            features:
                              - type: select-options
                                options: &sl_fx_white [none, candle, sunset, sunrise, sparkle, opal, glisten, underwater, cosmos, sunbeam, enchant, breathe]
                          - type: tile
                            entity: input_number.sl_fx_speed_kitchen_1
                            name: Kitchen 1 speed (0 slow, 1 fast)
                            features_position: bottom
                            features:
                              - type: numeric-input
                                style: slider
                          - type: tile
                            entity: light.kitchen_1
                            name: Kitchen 1 brightness
                            features_position: bottom
                            features:
                              - type: light-brightness
                      - &sl_fx_kitchen_2
                        type: vertical-stack
                        cards:
                          - type: tile
                            entity: select.sl_fx_kitchen_2
                            name: Kitchen 2 effect
                            icon: mdi:auto-fix
                            vertical: false
                            features_position: bottom
                            features:
                              - type: select-options
                                options: *sl_fx_white
                          - type: tile
                            entity: input_number.sl_fx_speed_kitchen_2
                            name: Kitchen 2 speed (0 slow, 1 fast)
                            features_position: bottom
                            features:
                              - type: numeric-input
                                style: slider
                          - type: tile
                            entity: light.kitchen_2
                            name: Kitchen 2 brightness
                            features_position: bottom
                            features:
                              - type: light-brightness
                - type: conditional
                  conditions:
                    - entity: input_select.sl_room_selector
                      state: "Hallway"
                  card:
                    type: vertical-stack
                    cards:
                      - &sl_fx_hallway_1
                        type: vertical-stack
                        cards:
                          - type: tile
                            entity: select.sl_fx_hallway_1
                            name: Hallway effect
                            icon: mdi:auto-fix
                            vertical: false
                            features_position: bottom
                            features:
                              - type: select-options
                                options: *sl_fx_white
                          - type: tile
                            entity: input_number.sl_fx_speed_hallway_1
                            name: Hallway speed (0 slow, 1 fast)
