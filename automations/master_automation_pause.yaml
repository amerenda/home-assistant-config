alias: "Security: Pause/Resume Security Automations"
id: master_automation_pause
description: >
  Dashboard toggle input_boolean.master_automation_pause pauses only the
  security automations: camera on/off on presence (security_everyone_left,
  security_someone_home), the privacy drift monitor
  (security_privacy_monitor_debounced) and the detection notifications
  (alex_reolink_detection_snapshot). Each of them has a condition on the
  toggle, so the pause survives an HA restart.
  A pause does not move the cameras. You control them by hand (dashboard
  buttons or privacy switches). Lights, Smart Lighting and the
  arrival/departure light and AC automations are not paused.
  On resume, this automation clears the manual override and re-syncs the
  cameras to occupancy immediately.
mode: single
trigger:
  - platform: state
    entity_id: input_boolean.master_automation_pause
    from: "on"
    to: "off"
action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.camera_manual_override
  - service: automation.trigger
    target:
      entity_id: automation.security_privacy_monitor_debounced
    data:
      skip_condition: true
