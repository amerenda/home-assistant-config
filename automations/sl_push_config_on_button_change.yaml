alias: "SL: Push Z2M config when a button action or a window scene slot changes"
id: sl_push_config_on_button_change
description: >
  A button action (input_text.sl_<switch>_b<n>_<short|long>, set through
  select.<same id> on the Switches tab) reaches the Z2M extension only in
  zigbee2mqtt/sl/config. Push the config at each change. The same for a window
  scene slot (input_text.sl_<room>_slot_<window>, WO-0274).
mode: single
trigger:
  - platform: state
    entity_id:
      - input_text.sl_living_room_b1_short
      - input_text.sl_living_room_b1_long
      - input_text.sl_living_room_b2_short
      - input_text.sl_living_room_b2_long
      - input_text.sl_living_room_b3_short
      - input_text.sl_living_room_b3_long
      - input_text.sl_living_room_b4_short
      - input_text.sl_living_room_b4_long
      - input_text.sl_bedroom_b1_short
      - input_text.sl_bedroom_b1_long
      - input_text.sl_bedroom_b2_short
      - input_text.sl_bedroom_b2_long
      - input_text.sl_bedroom_b3_short
      - input_text.sl_bedroom_b3_long
      - input_text.sl_bedroom_b4_short
      - input_text.sl_bedroom_b4_long
      - input_text.sl_bathroom_b1_short
      - input_text.sl_bathroom_b1_long
      - input_text.sl_bathroom_b2_short
      - input_text.sl_bathroom_b2_long
      - input_text.sl_bathroom_b3_short
      - input_text.sl_bathroom_b3_long
      - input_text.sl_bathroom_b4_short
      - input_text.sl_bathroom_b4_long
      - input_text.sl_kitchen_b1_short
      - input_text.sl_kitchen_b1_long
      - input_text.sl_kitchen_b2_short
