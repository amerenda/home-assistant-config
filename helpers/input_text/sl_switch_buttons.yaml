# Smart Lighting - button action of each Hue dimmer button.
# The value is a button action name ("Toggle Room", "Scene: Movie", ...).
# Empty = Default. No "initial": HA keeps the value at a restart.
# The dashboard shows select.<same id> (packages/sl_scenes.yaml).
# script.sl_push_config sends the values to Z2M.
