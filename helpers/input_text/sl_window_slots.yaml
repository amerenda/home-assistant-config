# Window scene slots (WO-0274). The scene that is the window scene of a room
# for one window; empty = Default (the room's own window scene '<Room> <Window>').
# Set through select.<same id> (packages/sl_window_slots.yaml) on the Button
# Config tab. No initial: the value stays after an HA restart.
